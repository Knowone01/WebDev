<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    <title> Pulkit Bhardwaj | Links </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <button id="theme-toggle"> Dark Mode</button>
        <!--
        ID vs Class:
        Both id and class can be used to select, style (CSS), and manipulate (JavaScript) HTML elements.
        
        ID: Used to uniquely identify a single element.
            CSS: #id-name | JS: getElementById("id-name")
        
        Class: Can be shared by multiple elements for common styling or functionality.
            CSS: .class-name | JS: querySelector(".class-name") or querySelectorAll(".class-name")
        
        An element can have both an id and a class.
        -->
        <img src="image.png" alt="Pulkit Bhardwaj" class="profile-img">
        <h1> Pulkit Bhardwaj</h1>
        <p class="bio"> fMech+ DS</p>
        <div class="links">
            <a href="https://github.com/Knowone01" target="_blank" class="link"> Github </a> 
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
